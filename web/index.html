<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天然气管网智能安全监测与仿真平台 V1.0</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="login" class="login"><form id="loginForm"><h1>天然气管网智能安全监测与仿真平台</h1><p>GasNet Safety Intelligence · V1.0</p><input id="username" value="admin" placeholder="用户名"><input id="password" value="Admin@123" type="password" placeholder="密码"><button>安全登录</button><small id="loginError"></small></form></div>
<div id="app" hidden><header><div><b>天然气管网智能安全监测与仿真平台</b><span> V1.0</span></div><div><i id="statusDot"></i><span id="simStatus">仿真已停止</span><span id="clock"></span><button class="ghost" onclick="logout()">退出</button></div></header>
<nav><button class="active" data-page="monitor">实时监控</button><button data-page="model">模型管理</button><button data-page="alarms">报警管理</button><button data-page="history">历史数据</button><button data-page="analysis">结果分析</button></nav>
<main><section id="monitor" class="page active"><div class="toolbar"><button onclick="command('start')">▶ 开始</button><button onclick="command('pause')">Ⅱ 暂停</button><button onclick="command('resume')">继续</button><button class="danger" onclick="command('stop')">■ 停止</button><span id="riskBadge" class="badge level0">Level 0 正常</span></div>
<div class="grid metrics"><article><label>入口压力</label><strong id="inlet">--</strong><small>MPa</small></article><article><label>总流量</label><strong id="totalFlow">--</strong><small>Nm³/h</small></article><article><label>在线阀门</label><strong>3 / 3</strong><small>台</small></article><article><label>仿真步数</label><strong id="tick">0</strong><small>step</small></article></div>
<div class="grid main-grid"><article class="topology"><h2>管网拓扑与运行状态</h2><svg viewBox="0 0 800 360"><defs><linearGradient id="pipe"><stop stop-color="#19d3ff"/><stop offset="1" stop-color="#2676ff"/></linearGradient></defs><circle cx="90" cy="180" r="35"/><text x="90" y="185">气源</text><path d="M125 180H310M310 70V290M310 70H510M310 180H510M310 290H510"/><g id="nodes"></g></svg></article><article><h2>支路实时参数</h2><table><thead><tr><th>支路</th><th>压力 MPa</th><th>流量</th><th>阀位 %</th><th>风险</th></tr></thead><tbody id="liveRows"></tbody></table></article></div>
<div class="grid charts"><article><h2>压力趋势</h2><canvas id="pressureChart"></canvas></article><article><h2>流量趋势</h2><canvas id="flowChart"></canvas></article><article><h2>阀门开度趋势</h2><canvas id="valveChart"></canvas></article></div></section>
<section id="model" class="page"><h2>天然气管网模型管理</h2><div id="modelList" class="cards"></div><form id="modelForm" class="form"><h2>创建管网模型</h2><input name="name" placeholder="模型名称" required><input name="diameter" type="number" step=".01" value="0.6" placeholder="管径(m)"><input name="length" type="number" step=".1" value="12.5" placeholder="管长(km)"><input name="inlet_pressure" type="number" step=".1" value="4.2" placeholder="入口压力"><input name="nominal_flow" type="number" value="70" placeholder="额定流量"><button>保存模型</button></form></section>
<section id="alarms" class="page"><h2>报警管理</h2><div id="alarmTable"></div></section><section id="history" class="page"><h2>历史运行数据</h2><div id="historyTable"></div></section><section id="analysis" class="page"><h2>PID 与 DRL 控制效果对比</h2><div id="analysisCards" class="cards"></div><p class="notice">注：默认展示种子数据；接入控制器后应以相同工况批次计算指标。</p></section></main></div><script src="/static/app.js"></script></body></html>
